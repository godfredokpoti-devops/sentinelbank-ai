<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SentinelBank AI</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#18212f}.top{background:#111827;color:white;padding:20px 32px}.wrap{max-width:1100px;margin:32px auto;padding:0 20px}.card{background:white;border:1px solid #dbe1e8;border-radius:10px;padding:22px;margin-bottom:18px}button{background:#111827;color:white;border:0;border-radius:6px;padding:10px 14px;cursor:pointer}input,textarea{width:100%;box-sizing:border-box;padding:10px;margin:6px 0 12px;border:1px solid #cbd5e1;border-radius:6px}pre{white-space:pre-wrap;background:#0b1020;color:#dbeafe;padding:16px;border-radius:8px;overflow:auto}.muted{color:#64748b}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#e2e8f0;margin-right:6px}</style></head><body><div class="top"><h1>SentinelBank AI</h1><div>Governed AML & transaction-risk investigation copilot</div></div><div class="wrap"><div class="card"><h2>Case investigation</h2><p class="muted">Synthetic data only. The model is advisory; human review controls disposition.</p><label>Case reference</label><input id="case" value="CASE-1001"><label>Analyst question</label><textarea id="question" rows="4">Summarize the material transaction-risk indicators and relevant policy evidence.</textarea><button onclick="runInvestigation()">Run investigation</button></div><div class="card"><h2>Result</h2><pre id="out">Start an investigation to view the evidence package.</pre></div></div><script>async function runInvestigation(){const out=document.getElementById('out');out.textContent='Running...';try{const r=await fetch('/api/v1/cases/'+document.getElementById('case').value+'/investigate',{method:'POST',headers:{'Content-Type':'application/json','X-API-Key':'dev-analyst-key','X-Analyst':'portfolio.demo'},body:JSON.stringify({analyst_question:document.getElementById('question').value,jurisdiction:'US'})});out.textContent=JSON.stringify(await r.json(),null,2)}catch(e){out.textContent=String(e)}}</script></body></html>
