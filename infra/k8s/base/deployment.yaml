apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelbank-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: sentinelbank-api}
  template:
    metadata:
      labels: {app: sentinelbank-api}
    spec:
      serviceAccountName: sentinelbank-api
      containers:
        - name: api
          image: REPLACE_WITH_ECR_IMAGE
          ports: [{containerPort: 8000}]
          env:
            - name: MODEL_PROVIDER
              value: local
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 15
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: sentinelbank-api
spec:
  selector: {app: sentinelbank-api}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinelbank-api
